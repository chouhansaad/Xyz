<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Navbar */
        nav {
            background: #222;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #ffcc00;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Hero Section */
        .hero {
            background: #ffcc00;
            text-align: center;
            padding: 50px 20px;
        }

        .hero h2 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Search */
        .search {
            text-align: center;
            padding: 25px;
        }

        .search input {
            width: 70%;
            max-width: 500px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Products */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 5%;
        }

        .product {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 12px 0;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff9900;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h1>MyStore</h1>

        <div>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart 🛒</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h2>Welcome to MyStore</h2>
        <p>Best Products at Best Prices</p>
    </section>

    <!-- Search -->
    <div class="search">
        <input type="text" placeholder="Search products...">
    </div>

    <!-- Products -->
    <section class="products">

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="T-Shirt">
            <h3>Men's T-Shirt</h3>
            <div class="price">₹499</div>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Shoes">
            <h3>Sports Shoes</h3>
            <div class="price">₹999</div>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Watch">
            <h3>Smart Watch</h3>
            <div class="price">₹1,499</div>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/300x200" alt="Headphones">
            <h3>Headphones</h3>
            <div class="price">₹799</div>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 MyStore | All Rights Reserved</p>
    </footer>

</body>
</html>
